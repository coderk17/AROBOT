[project]
name = "arobot"
version = "0.1.0"
description = "Enterprise WeCom intelligent customer service with LangChain RAG and MCP report processing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-chroma>=0.2.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-mcp-adapters>=0.2.0",
    "langgraph>=0.2.0",
    "chromadb>=0.5.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "wecom-aibot-sdk>=0.1.0",
    "unstructured[pdf,docx]>=0.16.0",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    "pillow>=10.0.0",
    "httpx>=0.27.0",
    "aiofiles>=24.0.0",
    "pyyaml>=6.0.0",
    "fastmcp>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "ruff>=0.8.0"]

[project.scripts]
arobot = "arobot.main:cli"
arobot-ingest = "arobot.scripts.ingest_docs:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arobot"]

[tool.hatch.build.targets.wheel.sources]
"src/arobot" = "arobot"

[tool.ruff]
line-length = 100
target-version = "py311"
